N   : 30  # Grid length
tstep: 1.e-3 # Timestep 
Ro : 100000. # Rossby number
beta: 0.0  # Rotation 
bc  : "periodic" # y boundary condition
forcing:    
  type: "None"    # No forcint
  Q: 1.
# initial condition  
ic:
  type: "gaussian"
  amp: 0.01
  width: 0.3
  x0: 0.0
  y0: 0.0
udrag :
  type: "None"
  tau_u: 10.
hdrag :
  type: "None"
  tau_h: 10.
  
# Input-Output
outfile : "intro.nc"
outvars:
  - h
  - u
  - v
  - E
  - q

io_freq: 10
print_freq: 10
