N   : 30  # Grid length
tstep: 1.e-3
Ro : 1000 # Strength of rotation
beta: 0.0
bc  : "periodic"
forcing:
  type: "None"
  Q: 1.
ic  :
  type: "plane_gravity_wave"
  amp: 0.001
  width: 0.5
udrag :
  type: "None"
  tau_u: 10.
hdrag :
  type: "None"
  tau_h: 10.
  
cor: 'f-plane'
# IO
outfile : "test.nc"
outvars:
  - h
  - u
  - v
  - E
  - q

io_freq: 10
print_freq: 10
